[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quilt-canon-feed"
version = "0.1.0"
description = "RSS/Atom/JSON feeds for canon lore — streaming substrate"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [{name = "SuperInstance", email = "[email protected]"}]
keywords = ["rss", "atom", "jsonfeed", "feed", "canon", "quilt", "streaming"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.scripts]
quilt-canon-feed = "quilt_canon_feed.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["quilt_canon_feed*"]
